
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DOM APP</title>

  <style>
   

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 40px;
    }

    .app {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    h1 {
      margin-bottom: 20px;
      text-align: center;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: black;
      color: white;
      font-size: 14px;
    }

    ul {
      list-style: none;
    }

    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #eee;
      padding: 14px;
      margin-bottom: 10px;
      border-radius: 8px;
    }

    .delete {
      background: crimson;
    }

    .stats {
      margin-top: 20px;
      text-align: center;
      color: #666;
    }
  </style>
</head>
<body>

  <div class="app">
    <h1>DOM APP</h1>

    <div class="input-group">
      <input id="taskInput" placeholder="Enter task" />
      <button id="addBtn">Add</button>
    </div>

    <ul id="taskList"></ul>

    <div class="stats">
      Total Tasks: <span id="count">0</span>
    </div>
  </div>

  <script>
    const input = document.getElementById("taskInput");
    const addBtn = document.getElementById("addBtn");
    const list = document.getElementById("taskList");
    const count = document.getElementById("count");

    function updateCount() {
      count.textContent = list.children.length;
    }

    function createTask(value) {
      const li = document.createElement("li");

      li.innerHTML = `
        <span>${value}</span>
        <button class="delete">Delete</button>
      `;

      return li;
    }

    addBtn.addEventListener("click", () => {
      const value = input.value.trim();

      if (!value) return;

      const task = createTask(value);

      list.appendChild(task);

      input.value = "";

      updateCount();
    });

    input.addEventListener("keypress", (e) => {
      if (e.key === "Enter") {
        addBtn.click();
      }
    });

    // EVENT DELEGATION
    list.addEventListener("click", (e) => {
      if (e.target.classList.contains("delete")) {
        e.target.parentElement.remove();
        updateCount();
      }
    });
  </script>

</body>
</html>
